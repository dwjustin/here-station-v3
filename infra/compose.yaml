services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    volumes:
      - ../backend/app:/app/backend/app
      # shortcut: 역 지도를 로컬 data/maps 에서 읽는다. Supabase station-maps 버킷 연결 시 제거
      - ../data/maps:/app/data/maps:ro

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
