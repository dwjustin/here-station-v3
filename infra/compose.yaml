services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    volumes:
      - ../backend/app:/app/backend/app
      - ../data/maps:/app/data/maps:ro

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
